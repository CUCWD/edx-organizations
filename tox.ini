[tox]
envlist = py312-django{42,52}, quality, docs

[testenv]
setenv = 
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
deps =
    django42: Django>=4.2,<4.3
    django42: -r{toxinidir}/test-requirements.txt
    django52: Django>=5.2,<5.3
    django52: -r{toxinidir}/requirements/ulmo-test.in
commands = 
    python manage.py check
    python -Wd -m pytest {posargs}
    coverage report

[testenv:quality]
setenv = 
    PYTHONPATH = {toxinidir}
deps = 
    -r{toxinidir}/requirements/ulmo-test.in
commands = 
    pycodestyle organizations
    pylint --rcfile=pylintrc organizations


[testenv:docs]
deps =
    -r{toxinidir}/requirements/ulmo-test.in
    doc8
    build
    twine
commands =
    doc8 --ignore D001 README.rst docs
    python -m build --sdist --wheel --outdir {envtmpdir}/dist
    python -m twine check {envtmpdir}/dist/*
